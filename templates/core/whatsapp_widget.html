<style>
    /* Scoped WhatsApp Widget Styles */
    .wa-widget-wrap {
        position: fixed;
        right: 1.25rem;
        top: 6rem;
        z-index: 2500;
        font-family: 'Inter', sans-serif;
    }
    
    .wa-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        border: none;
        border-radius: 999px;
        background: #25d366;
        color: #fff;
        font-weight: 700;
        padding: 0.85rem 1.15rem 0.85rem 0.85rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.95rem;
        text-decoration: none;
    }
    
    .wa-btn:hover {
        filter: brightness(1.05);
        transform: scale(1.03);
    }
    
    .wa-btn.hidden-btn {
        opacity: 0;
        visibility: hidden;
        transform: scale(0.8);
        pointer-events: none;
    }
    
    .wa-btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
    }
    
    .wa-chat-box {
        position: absolute;
        top: 3.5rem;
        right: 0;
        width: 320px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 2501;
    }
    
    .wa-chat-box.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    
    .wa-header {
        background: #075e54;
        color: #fff;
        padding: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        position: relative;
    }

    .wa-header-avatar {
        width: 40px;
        height: 40px;
        background: #25d366;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .wa-header-info h4 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
    }
    
    .wa-header-info p {
        margin: 0;
        font-size: 0.75rem;
        opacity: 0.8;
    }

    .wa-close-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 1.5rem;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
        line-height: 1;
    }

    .wa-close-btn:hover {
        opacity: 1;
    }
    
    .wa-body {
        background: #e5ddd5;
        padding: 1.25rem;
        min-height: 120px;
        display: flex;
        flex-direction: column;
    }
    
    .wa-bubble {
        background: #fff;
        padding: 0.75rem 1rem;
        border-radius: 0 12px 12px 12px;
        font-size: 0.9rem;
        color: #303030;
        max-width: 85%;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        position: relative;
    }

    .wa-bubble::before {
        content: '';
        position: absolute;
        top: 0;
        left: -8px;
        width: 0;
        height: 0;
        border-right: 10px solid #fff;
        border-bottom: 10px solid transparent;
    }

    .wa-footer {
        padding: 0.75rem;
        background: #f0f0f0;
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .wa-input {
        flex: 1;
        border: none;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        font-size: 0.9rem;
        outline: none;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    .wa-send-btn {
        background: #25d366;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .wa-send-btn:hover {
        transform: scale(1.05);
    }

    @media (max-width: 640px) {
        .wa-widget-wrap { right: 0.8rem; top: 5rem; }
        .wa-btn { font-size: 0.92rem; padding: 0.75rem 0.95rem 0.75rem 0.75rem; }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('wa-toggle-btn');
    const closeBtn = document.getElementById('wa-close-btn');
    const chatBox = document.getElementById('wa-chat-box');
    const sendBtn = document.getElementById('wa-send-btn');
    const inputField = document.getElementById('wa-input');
    const waNumber = "56991418827";

    function toggleChat() {
        chatBox.classList.toggle('active');
        toggleBtn.classList.toggle('hidden-btn');
        if(chatBox.classList.contains('active')) {
            setTimeout(() => inputField.focus(), 100);
        }
    }

    function sendMessage() {
        const text = inputField.value.trim();
        let waUrl = `https://wa.me/${waNumber}`;
        if(text !== "") {
            waUrl += `?text=${encodeURIComponent(text)}`;
        }
        window.open(waUrl, '_blank');
        inputField.value = "";
        toggleChat();
    }

    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', toggleChat);
    sendBtn.addEventListener('click', sendMessage);

    inputField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
});
</script>
